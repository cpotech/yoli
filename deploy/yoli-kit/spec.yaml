# Docker Sandboxes kit for yoli. Defines a `yoli` agent so any repo can be
# worked on in an isolated microVM. Launch via the wrapper (which also builds
# the image and registers the proxy secrets):
#
#   scripts/sbx.sh                                  # from any repo
#   # equivalent: sbx run --kit ./deploy/yoli-kit yoli <workspace>
#
# API keys never enter the sandbox. yoli reads the placeholder config at
# files/home/.config/yoli/config.json (each api_key = "yoli-sbx-<provider>");
# the host-side proxy swaps that placeholder for the real key on egress. The
# placeholder config and the matching proxy secrets are generated by
# scripts/sbx.sh from ~/.config/yoli/config.json — see the comment below the
# network block for why credential wiring is NOT declared in this kit.
schemaVersion: "1"
kind: agent
name: yoli
displayName: yoli (sandboxed)
description: yoli coding agent in an isolated Docker Sandboxes microVM

agent:
  image: yoli:sbx            # built by Dockerfile.sbx
  aiFilename: AGENTS.md
  entrypoint:
    run: [yoli, tui]

network:
  # openrouter.ai and *.proxy.runpod.net are already in the default policy;
  # the Brave search host is not, so allow it here.
  allowedDomains:
    - "api.search.brave.com:443"

# Credential injection is handled by proxy custom-secrets registered by
# scripts/sbx.sh (`sbx secret set-custom` keyed by provider host, with a unique
# placeholder "yoli-sbx-<provider>" matching the inert api_key in
# files/.../config.json). The host-side proxy swaps the placeholder for the real
# key on egress, so real keys never enter the sandbox. Kit-level env credentials
# are intentionally NOT used here: this sbx build does not inject env-only kit
# credentials at runtime ("env-only credential will not be injected"), and
# declaring network.serviceDomains would claim the hosts and block the working
# custom-secret path.
